[package]
name = "nstun-tun"
description = "OS TUN devices (Linux, Android, macOS, iOS) as nstun packet sources and sinks"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
nstun = { path = "../nstun", version = "0.8.0" }
tokio = { version = "1.53.1", features = ["net", "sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
nstun-packet = { path = "../nstun-packet", version = "0.8.0" }
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "sync", "time"] }
