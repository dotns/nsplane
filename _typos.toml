[default]
# Windows SDDL security descriptor strings (`BA` = built-in Administrators); BKD campaign IDs (nsplane-ba-*)
extend-ignore-re = ["\"O:SY[^\"]*\"", "nsplane-ba-[0-9]+"]

[default.extend-words]
# Mullvad's traffic-analysis defense, mentioned in docs
DAITA = "DAITA"
# RFC 3168 ECN-Capable Transport codepoint
ect = "ect"

[default.extend-identifiers]
# libc `msghdr` field
msg_controllen = "msg_controllen"
