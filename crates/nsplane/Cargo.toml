[package]
name = "nsplane"
description = "Tokio driver for the nsplane data plane: local-side and network-side I/O traits"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
nsplane-core = { path = "../nsplane-core", version = "0.8.0" }
nsplane-packet = { path = "../nsplane-packet", version = "0.8.0" }
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.53.1", features = ["net", "rt", "sync", "time"] }
tracing = "0.1.40"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
nix = { version = "0.31", default-features = false, features = ["net", "uio"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
