[package]
name = "nsplane"
description = "Tokio driver for the nsplane data plane: local-side and network-side I/O traits"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
nsplane-core = { path = "../nsplane-core", version = "0.10.0" }
nsplane-packet = { path = "../nsplane-packet", version = "0.10.0" }
quinn-udp = { version = "0.6.3", default-features = false, features = ["tracing"] }
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.53.1", features = ["net", "rt", "sync", "time"] }
tracing = "0.1.40"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
nix = { version = "0.31", default-features = false, features = ["net", "uio"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[[bench]]
name = "udp_offload"
harness = false

[[bench]]
name = "worker_pool"
harness = false

[[bench]]
name = "local_graph"
harness = false
