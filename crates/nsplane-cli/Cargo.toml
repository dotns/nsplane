[package]
name = "nsplane-cli"
description = "an implementation of the WireGuard® protocol designed for portability and speed"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
nsplane = { path = "../nsplane", version = "0.9.0" }
nsplane-tun = { path = "../nsplane-tun", version = "0.9.0" }
nsplane-uapi = { path = "../nsplane-uapi", version = "0.9.0" }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.19"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["resource", "user"] }
