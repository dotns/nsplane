[package]
name = "nsplane-ether"
description = "Ethernet adapter for one guest: ethernet frames to IP packets, with ARP, IPv6 neighbor discovery and router advertisements, and a single-lease DHCPv4 server"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
nsplane = { path = "../nsplane", version = "0.19.3" }
nsplane-packet = { path = "../nsplane-packet", version = "0.19.3" }
tokio = { version = "1.54.0", features = ["io-util", "net", "rt", "sync"] }
tracing = "0.1.40"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
futures-core = "0.3.32"
nsplane-netstack = { path = "../nsplane-netstack", version = "0.19.3" }
tokio = { version = "1.54.0", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
