[package]
name = "nsplane-nat"
description = "IPv4/IPv6 translation and service-publishing NAT packet filters for nsplane"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
nsplane = { path = "../nsplane", version = "0.10.0" }
nsplane-core = { version = "0.10.0", path = "../nsplane-core" }
nsplane-packet = { version = "0.10.0", path = "../nsplane-packet" }
arc-swap = "1.7.1"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["sync"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "sync"] }

[[bench]]
name = "masquerade"
harness = false

[[bench]]
name = "translate"
harness = false
