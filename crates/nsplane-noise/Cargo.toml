[package]
name = "nsplane-noise"
description = "an implementation of the WireGuard® protocol designed for portability and speed"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []

[dependencies]
parking_lot = "0.12"
portable-atomic = { version = "1.13.1", features = ["fallback"] }
tracing = "0.1.40"
aws-lc-rs = "1.18.1"
subtle = "2.6.1"
zerocopy = { version = "0.8.59", features = ["derive"] }
x25519-dalek = { version = "2.0.1", features = [
    "reusable_secrets",
    "static_secrets",
] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
chacha20poly1305 = "0.10.0-pre.1"
aead = "0.5.0-pre.2"
blake2 = "0.10"
hmac = "0.12"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["time"] }

[dev-dependencies]
etherparse = "0.13"
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "data_path"
harness = false
