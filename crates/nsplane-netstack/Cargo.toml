[package]
name = "nsplane-netstack"
description = "User-space TCP/IP stack for nsplane on smoltcp: TCP and UDP endpoints behind the packet source/sink traits"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
futures-core = "0.3.32"
nsplane = { path = "../nsplane", version = "0.10.1" }
nsplane-packet = { path = "../nsplane-packet", version = "0.10.1" }
smoltcp = { version = "0.14.0", git = "https://github.com/dotns/smoltcp", tag = "v0.14.0-nsplane.4", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-tcp-cubic"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1.40"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt", "sync", "time"] }
