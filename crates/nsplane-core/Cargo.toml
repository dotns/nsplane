[package]
name = "nsplane-core"
description = "Sans-I/O WireGuard engine core for the nsplane data plane"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
nsplane-noise = { version = "0.10.1", path = "../nsplane-noise" }
nsplane-packet = { version = "0.10.1", path = "../nsplane-packet" }
ip_network = "0.4.1"
ip_network_table = "0.2.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
tracing = "0.1.40"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "data_path"
harness = false
