[package]
name = "nsplane-dns"
description = "DNS serving for nsplane: wire codec, async Resolver trait and resolver building blocks"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[features]
netstack = ["dep:nsplane-netstack"]

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
nsplane-netstack = { path = "../nsplane-netstack", version = "0.20.2", optional = true }
simple-dns = { path = "../../third_party/simple-dns", version = "0.12.0", default-features = false, features = ["std"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["io-util", "net", "rt", "sync", "time"] }
tracing = "0.1.40"

[dev-dependencies]
futures-core = "0.3.32"
nsplane = { path = "../nsplane", version = "0.20.2" }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "sync", "test-util", "time"] }
