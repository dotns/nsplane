[package]
name = "nsplane-tun"
description = "OS TUN devices (Linux, Android, macOS, iOS) as nsplane packet sources and sinks"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
nsplane = { path = "../nsplane", version = "0.10.0" }
tokio = { version = "1.53.1", features = ["net", "rt", "sync", "time"] }
tracing = "0.1.40"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# JUSTIFICATION: Wintun is the only userspace TUN driver on Windows; the bindings load the
# signed wintun.dll at runtime (docs/decisions/2026-10-01-wintun.md).
wintun-bindings = "0.7.40"
# JUSTIFICATION: hashes wintun.dll against the caller's pin before it is loaded.
sha2 = "0.10.9"
# JUSTIFICATION: ConvertInterfaceAliasToLuid for the exclusive adapter-name check and
# Get/SetIpInterfaceEntry for the MTU; the same version and features wintun-bindings already
# pulls in.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
futures-core = "0.3.32"
nsplane-netstack = { path = "../nsplane-netstack", version = "0.10.0" }
nsplane-packet = { path = "../nsplane-packet", version = "0.10.0" }
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[[bench]]
name = "offload"
harness = false
