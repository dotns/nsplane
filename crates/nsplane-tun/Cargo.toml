[package]
name = "nsplane-tun"
description = "OS TUN devices (Linux, Android, macOS, iOS) as nsplane packet sources and sinks"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
nsplane = { path = "../nsplane", version = "0.8.0" }
tokio = { version = "1.53.1", features = ["net", "sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# JUSTIFICATION: Wintun is the only userspace TUN driver on Windows; the bindings load the
# signed wintun.dll at runtime (docs/decisions/2026-10-01-wintun.md).
wintun-bindings = "0.7.40"

[dev-dependencies]
nsplane-packet = { path = "../nsplane-packet", version = "0.8.0" }
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "sync", "time"] }
