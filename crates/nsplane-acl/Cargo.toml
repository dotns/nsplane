[package]
name = "nsplane-acl"
description = "Accept-only ACL policy engine and packet filters for nsplane"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
nsplane-core = { version = "0.10.1", path = "../nsplane-core" }
nsplane-packet = { version = "0.10.1", path = "../nsplane-packet" }
arc-swap = "1.7.1"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.40"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
nix = { version = "0.31", default-features = false, features = ["time"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
serde_json = "1.0.149"

[[bench]]
name = "namespaces"
harness = false

[[bench]]
name = "node_l3"
harness = false
