[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "openssl", reason = "pma-rust Lock 2: rustls/aws-lc-rs only" },
    { crate = "openssl-sys", reason = "pma-rust Lock 2: rustls/aws-lc-rs only" },
    { crate = "native-tls", reason = "pma-rust Lock 2: rustls/aws-lc-rs only" },
    { crate = "ring", reason = "crypto backend is aws-lc-rs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/dotns/smoltcp"]
